name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'version.json'
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'scripts/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Copiar o site para o app
        run: node scripts/prepare.mjs web

      - name: Criar projeto Android
        run: npx cap add android

      - name: Ajustar permissões, ícones e versão
        run: node scripts/prepare.mjs android
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar (release)
        working-directory: android
        run: ./gradlew assembleRelease -x lintVitalRelease -x lintVitalAnalyzeRelease --no-daemon

      - name: Assinar o APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks android-signing/maxeditor.jks --ks-pass pass:maxeditor123 --key-pass pass:maxeditor123 --ks-key-alias maxeditor --out MaxEditor.apk aligned.apk
          "$BT/apksigner" verify --print-certs MaxEditor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MaxEditor-apk
          path: MaxEditor.apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./version.json').version")
          NOTES=$(node -p "require('./version.json').notes.map(n => '- ' + n).join('\n')")
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release edit "v$VER" --latest
          else
            gh release create "v$VER" --title "Max Editor $VER" --notes "$NOTES" --latest
          fi
          gh release upload "v$VER" MaxEditor.apk --clobber
